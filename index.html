<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f0"><title>食物档案 · Food Log</title>
<style>
:root{--bg:#f7f7f0;--paper:#fffefa;--ink:#30372f;--muted:#879084;--line:#e8eadf;--green:#71866b;--pale:#e8eee3;--gold:#d4a93d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding:18px 16px 100px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 20px}.brand{font-size:22px;font-weight:800}.brand small{font-size:11px;color:var(--muted);letter-spacing:1px;margin-left:8px}
.hero{background:var(--pale);border-radius:22px;padding:22px;position:relative}.hero:after{content:"✿";position:absolute;right:22px;top:7px;font-size:70px;color:#cbd8c4}.eyebrow{font-size:11px;color:var(--green);letter-spacing:1px;font-weight:700}.hero h1{font-size:24px;margin:9px 0 5px}.hero p{margin:0;color:#697665;font-size:13px}.stats{display:flex;gap:25px;margin-top:20px}.stat strong{display:block;font-size:22px}.stat small{font-size:11px;color:var(--muted)}
.nav{display:flex;gap:7px;overflow:auto;margin:18px 0 20px;padding-bottom:3px}.nav button,.pill{white-space:nowrap;background:var(--paper);border:1px solid var(--line);border-radius:30px;padding:10px 15px;color:#687362}.nav button.active,.pill.active{background:var(--green);color:white;border-color:var(--green)}
.section{display:none}.section.active{display:block}.head{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 12px}.head h2{font-size:17px;margin:0}.muted{font-size:12px;color:var(--muted)}.btn{background:var(--green);color:white;border-radius:13px;padding:11px 15px;font-weight:700}.btn.light{background:var(--pale);color:var(--green)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.search,.select,.field input,.field textarea,.field select{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);outline:none}.search{flex:1;min-width:160px}.select{max-width:48%}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 6px 20px #30372f0a;min-width:0}.cover{height:145px;background:#eff0e8;display:flex;align-items:center;justify-content:center;color:#a2aa9b;font-size:28px}.cover img{width:100%;height:100%;object-fit:cover}.cardbody{padding:12px}.title{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:11px;color:var(--muted);margin-top:5px}.stars{color:var(--gold);letter-spacing:1px;margin-top:7px}.badge{display:inline-block;background:#fbf1d7;color:#94742e;border-radius:20px;padding:4px 8px;font-size:10px;margin-top:7px}.empty{border:1px dashed #d9dfd2;background:var(--paper);border-radius:16px;padding:28px;text-align:center;color:var(--muted);font-size:13px}
.modal{display:none;position:fixed;inset:0;background:#20251f77;z-index:5;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:var(--bg);width:min(650px,100%);max-height:93vh;overflow:auto;border-radius:23px 23px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheettop h2{font-size:19px;margin:0}.close{border-radius:50%;width:34px;height:34px;background:#e9ece4;font-size:20px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:700;color:#687362;margin-bottom:6px}.field input,.field textarea,.field select{width:100%}.field textarea{min-height:76px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rating{display:flex;gap:7px}.rating button{background:none;color:#d8d9d1;font-size:28px;padding:0}.rating button.on{color:var(--gold)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chips button{border-radius:22px;padding:8px 11px;background:#edf0e8;color:#71806b;font-size:12px}.chips button.on{background:var(--green);color:white}.photoLine{display:flex;gap:10px;align-items:center}.preview{width:70px;height:70px;object-fit:cover;border-radius:12px;background:#edf0e8}.save{width:100%;padding:14px;border-radius:13px;background:var(--green);color:white;font-weight:750;margin-top:12px}.dishrow{border:1px solid var(--line);background:var(--paper);padding:12px;border-radius:13px;margin:9px 0}.dishrow input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;margin:4px 0}.toast{display:none;position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#30372f;color:white;padding:10px 16px;border-radius:22px;z-index:20;font-size:12px}
@media(max-width:650px){
.app{padding:12px 12px calc(92px + env(safe-area-inset-bottom))}
header{align-items:flex-start;gap:8px;flex-wrap:wrap;padding-bottom:14px}
header>div:last-child{display:flex;gap:6px}
header .btn{padding:9px 10px;font-size:12px}
.brand{font-size:20px}
.hero{padding:18px;border-radius:19px}
.hero h1{font-size:20px;max-width:82%}
.stats{gap:18px}
.nav{position:fixed;z-index:4;left:0;right:0;bottom:0;margin:0;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#fffefaee;backdrop-filter:blur(12px);border-top:1px solid var(--line);justify-content:space-around}
.nav button{font-size:12px;padding:10px 12px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.cover{height:112px}
.cardbody{padding:10px}
.head{gap:8px;align-items:center}
.head .btn{padding:10px 11px;font-size:12px;white-space:nowrap}
.sheet{max-height:94vh;padding:16px 15px calc(22px + env(safe-area-inset-bottom))}
.field input,.field textarea,.field select,.search,.select{font-size:16px}
.row{gap:8px}
.save{position:sticky;bottom:0}
}
@media(min-width:800px){.cover{height:185px}}
</style></head>
<body><main class="app">
<header><div class="brand">食物档案 <small>FOOD LOG</small></div><div><button class="btn light" id="backup">导出备份</button><button class="btn light" id="restore">导入</button><input type="file" id="restoreFile" accept="application/json" hidden></div></header>
<div class="hero"><div class="eyebrow">YOUR LITTLE TASTE ARCHIVE</div><h1>把喜欢的味道，好好收藏起来。</h1><p>记下买过的食物、喝过的奶茶，还有值得再去的餐厅。</p><div class="stats"><div class="stat"><strong id="countAll">0</strong><small>条记录</small></div><div class="stat"><strong id="countTodo">0</strong><small>待评价</small></div><div class="stat"><strong id="countMonth">0</strong><small>本月记录</small></div></div></div>
<nav class="nav"><button class="active" data-tab="home">⌂ 首页</button><button data-tab="food">▦ 食物</button><button data-tab="tea">◉ 奶茶</button><button data-tab="restaurant">⌖ 餐厅</button></nav>
<section class="section active" id="home"><div class="head"><h2>最近记录</h2><span class="muted">随时补充感想就好</span></div><div id="recent" class="grid"></div><div class="head"><h2>还没写评价</h2></div><div id="todo" class="grid"></div></section>
<section class="section" id="food"><div class="head"><h2>食物档案</h2><div style="display:flex;gap:7px"><button class="btn light" id="receiptOpen">📷 小票识别</button><button class="btn" data-add="food">＋ 记录</button></div></div><div class="toolbar"><input class="search" id="foodSearch" placeholder="搜索商品、感想…"><select class="select" id="foodCat"><option value="">所有分类</option></select></div><div id="foodGrid" class="grid"></div></section>
<section class="section" id="tea"><div class="head"><h2>奶茶实验室 🧋</h2><button class="btn" data-add="tea">＋ 记录奶茶</button></div><p class="muted">把品牌、口味和甜度偏好都记下来，下次点单有据可循。</p><div class="toolbar"><input class="search" id="teaSearch" placeholder="搜索品牌、口味…"></div><div id="teaGrid" class="grid"></div></section>
<section class="section" id="restaurant"><div class="head"><h2>餐厅 & 菜品地图 🍽</h2><button class="btn" data-add="restaurant">＋ 记录探店</button></div><p class="muted">按餐厅回忆每道菜：上次点了什么、哪道值得再吃。</p><div class="toolbar"><input class="search" id="restSearch" placeholder="搜索餐厅或菜品…"></div><div id="restGrid" class="grid"></div></section>
</main><div class="toast" id="toast"></div>

<div class="modal" id="formModal"><div class="sheet"><div class="sheettop"><h2 id="formHeading">新记录</h2><button class="close" data-close="formModal">×</button></div><form id="recordForm"><input type="hidden" id="rid"><input type="hidden" id="rtype">
<div id="commonFields">
<div class="field"><label id="nameLabel">商品名称 *</label><input id="name" required placeholder="写下名称"></div>
<div class="row"><div class="field"><label>日期</label><input type="date" id="date"></div><div class="field" id="priceField"><label>价格（可选）</label><input type="number" min="0" step=".01" id="price" placeholder="¥"></div></div>
<div class="field" id="categoryField"><label>分类</label><select id="category"></select></div>
<div class="field" id="photoField"><label>照片（可选）</label><div class="photoLine"><img id="photoPreview" class="preview" alt=""><button type="button" class="btn light" id="choosePhoto">拍照 / 选照片</button><button type="button" class="btn light" id="clearPhoto">移除</button><input type="file" id="photo" accept="image/*" capture="environment" hidden></div></div>
</div>
<div id="teaFields" hidden>
<div class="row"><div class="field"><label>品牌 / 店铺</label><input id="teaBrand" placeholder="例如：喜茶"></div><div class="field"><label>口味 / 商品名</label><input id="teaFlavor" placeholder="例如：多肉葡萄"></div></div>
<div class="row"><div class="field"><label>糖度</label><select id="sugar"><option value="">未记录</option><option>标准糖</option><option>七分糖</option><option>五分糖</option><option>三分糖</option><option>微糖</option><option>无糖</option></select></div><div class="field"><label>冰量</label><select id="ice"><option value="">未记录</option><option>正常冰</option><option>少冰</option><option>去冰</option><option>常温</option><option>热饮</option></select></div></div>
<div class="field"><label>奶茶维度（可多选）</label><div class="chips" id="teaTags"></div></div>
</div>
<div id="restFields" hidden>
<div class="field"><label>餐厅名称 *</label><input id="restaurantName" placeholder="餐厅名称"></div>
<div class="row"><div class="field"><label>地点 / 分店（可选）</label><input id="location" placeholder="商场、街道或分店"></div><div class="field"><label>人均 / 本次花费（可选）</label><input type="number" id="spend" min="0" step=".01" placeholder="¥"></div></div>
<div class="field"><label>这次吃了哪些菜？</label><div id="dishes"></div><button type="button" class="btn light" id="addDish">＋ 添加一道菜</button></div>
</div>
<div class="field" id="ratingField"><label>整体评分 <span class="muted">· 可以以后再评</span></label><div class="rating" id="rating"></div></div>
<div class="field" id="noteField"><label>感想 / 备注 <span class="muted">· 可留空</span></label><textarea id="note" placeholder="随手记一句就好…"></textarea></div>
<button class="save" type="submit">保存记录</button></form></div></div>
<div class="modal" id="receiptModal"><div class="sheet">
<div class="sheettop"><h2>小票识别 📷</h2><button class="close" data-close="receiptModal">×</button></div>
<p class="muted">拍下或选择小票照片，识别后可以逐项修改，再一次性收录。识别在当前浏览器中进行；首次需要下载中文识别模型，建议保持网络畅通。</p>
<div class="field"><label>小票照片</label><input id="receiptPhoto" type="file" accept="image/*" capture="environment"><img id="receiptPreview" style="display:none;width:100%;max-height:220px;object-fit:contain;border-radius:12px;margin-top:10px;background:#eee"></div>
<button type="button" class="btn" id="runOCR" style="width:100%">开始识别</button>
<div id="ocrStatus" class="muted" style="margin:12px 0"></div>
<div class="field"><label>识别原文（也可以手动修改）</label><textarea id="ocrText" placeholder="识别结果会显示在这里…" style="min-height:110px"></textarea></div>
<div class="field"><label>识别出的商品（可编辑；不需要的行可以删除）</label><div id="receiptItems"></div><button type="button" class="btn light" id="addReceiptItem">＋ 手动添加一项</button></div>
<button type="button" class="save" id="saveReceipt">收录所有商品</button>
</div></div>
<div class="modal" id="detailModal"><div class="sheet"><div class="sheettop"><h2>记录详情</h2><button class="close" data-close="detailModal">×</button></div><div id="detail"></div></div></div>
<script>
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);
const cats=['饮料','零食','甜品','主食','调味品','生鲜','其他'];
const teaDims=['茶味浓','奶味浓','偏甜','甜度刚好','清爽','厚重','有特色小料','性价比高','不会回购','想再喝'];
let records=[],photoData='',rate=0,selectedTea=[];
const dbreq=indexedDB.open('FoodLogV1',1);let db;
dbreq.onupgradeneeded=e=>e.target.result.createObjectStore('data');
dbreq.onsuccess=async e=>{db=e.target.result;records=await dbGet('records')||[];render()};
function dbGet(k){return new Promise(r=>{let q=db.transaction('data').objectStore('data').get(k);q.onsuccess=()=>r(q.result)})}
function persist(){let t=db.transaction('data','readwrite');t.objectStore('data').put(records,'records')}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2000)}
function stars(n){return n?'★'.repeat(n)+'☆'.repeat(5-n):'尚未评分'}
function img(r){return r.photo?`<img src="${r.photo}" alt="">`:'✿'}
function card(r){let title=r.type==='restaurant'?r.restaurant:r.type==='tea'?(r.brand+' · '+r.flavor):r.name;let sub=r.type==='restaurant'?(r.dishes||[]).map(d=>d.name).filter(Boolean).slice(0,3).join('、'):r.type==='tea'?`${r.sugar||'糖度未记'} · ${r.ice||'冰量未记'}`:(r.category||'未分类');return `<article class="card" data-open="${r.id}"><div class="cover">${img(r)}</div><div class="cardbody"><div class="title">${esc(title||'未命名')}</div><div class="meta">${esc(r.date||'日期未填写')} · ${esc(sub)}</div><div class="stars">${r.rating?stars(+r.rating):'<span class="badge">待评价</span>'}</div></div></article>`}
function list(id,arr){$(id).innerHTML=arr.length?arr.map(card).join(''):'<div class="empty" style="grid-column:1/-1">这里还空空的。<br>点右上角按钮，收录第一条记录吧 ✿</div>'}
function render(){let sorted=[...records].sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('countAll').textContent=records.length;$('countTodo').textContent=records.filter(r=>!r.rating&&!r.note).length;$('countMonth').textContent=records.filter(r=>(r.date||'').slice(0,7)===today().slice(0,7)).length;list('recent',sorted.slice(0,6));list('todo',sorted.filter(r=>!r.rating&&!r.note).slice(0,4));list('foodGrid',filter('food'));list('teaGrid',filter('tea'));list('restGrid',filter('restaurant'));$('foodCat').innerHTML='<option value="">所有分类</option>'+cats.map(c=>`<option>${c}</option>`).join('')}
function filter(type){let q=($(type==='food'?'foodSearch':type==='tea'?'teaSearch':'restSearch').value||'').toLowerCase();return records.filter(r=>r.type===type).filter(r=>{let text=JSON.stringify(r).toLowerCase();return text.includes(q)}).filter(r=>type!=='food'||!$('foodCat').value||r.category===$('foodCat').value).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function tab(name){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===name));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===name))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
['foodSearch','teaSearch','restSearch','foodCat'].forEach(id=>$(id).addEventListener('input',render));
function showModal(id){$(id).classList.add('open')}function hideModal(id){$(id).classList.remove('open')}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hideModal(b.dataset.close));
function setRating(n){rate=n;[...$('rating').children].forEach((b,i)=>b.classList.toggle('on',i<n))}
function makeRating(){ $('rating').innerHTML=Array.from({length:5},(_,i)=>`<button type="button" data-r="${i+1}">★</button>`).join('');$('rating').querySelectorAll('button').forEach(b=>b.onclick=()=>setRating(+b.dataset.r));}
function makeTeaTags(){ $('teaTags').innerHTML=teaDims.map(t=>`<button type="button" data-tag="${t}">${t}</button>`).join('');$('teaTags').querySelectorAll('button').forEach(b=>b.onclick=()=>{let t=b.dataset.tag;selectedTea=selectedTea.includes(t)?selectedTea.filter(x=>x!==t):[...selectedTea,t];b.classList.toggle('on')})}
function addDishRow(d={}){let el=document.createElement('div');el.className='dishrow';el.innerHTML=`<input class="dishname" placeholder="菜品名称，例如：招牌牛肉面" value="${esc(d.name||'')}"><div class="row"><select class="dishrate"><option value="">菜品评分</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${+d.rating===n?'selected':''}>${n} 星</option>`).join('')}</select><input class="dishnote" placeholder="简单备注：必点 / 偏咸…" value="${esc(d.note||'')}"></div><button type="button" class="muted removeDish">移除这道菜</button>`;el.querySelector('.removeDish').onclick=()=>el.remove();$('dishes').append(el)}
$('addDish').onclick=()=>addDishRow();
function openForm(type,rec){$('recordForm').reset();$('rid').value=rec?.id||'';$('rtype').value=type;photoData=rec?.photo||'';rate=+(rec?.rating||0);selectedTea=rec?.teaTags||[];$('photoPreview').src=photoData;$('date').value=rec?.date||today();$('name').value=rec?.name||'';$('price').value=rec?.price||'';$('category').innerHTML=cats.map(c=>`<option ${rec?.category===c?'selected':''}>${c}</option>`).join('');$('note').value=rec?.note||'';$('teaBrand').value=rec?.brand||'';$('teaFlavor').value=rec?.flavor||'';$('sugar').value=rec?.sugar||'';$('ice').value=rec?.ice||'';$('restaurantName').value=rec?.restaurant||'';$('location').value=rec?.location||'';$('spend').value=rec?.spend||'';$('dishes').innerHTML='';(rec?.dishes||[]).forEach(addDishRow);if(type==='restaurant'&&!rec)addDishRow();$('formHeading').textContent=rec?'编辑记录':({food:'记录一件食物',tea:'记录一杯奶茶',restaurant:'记录一次探店'}[type]);$('commonFields').hidden=type==='restaurant';$('teaFields').hidden=type!=='tea';$('restFields').hidden=type!=='restaurant';$('categoryField').hidden=type!=='food';$('priceField').hidden=type==='restaurant';$('photoField').hidden=false;$('ratingField').hidden=type==='restaurant';$('nameLabel').textContent='商品名称 *';$('name').required=type==='food';$('restaurantName').required=type==='restaurant';makeRating();setRating(rate);makeTeaTags();$('teaTags').querySelectorAll('button').forEach(b=>b.classList.toggle('on',selectedTea.includes(b.dataset.tag)));showModal('formModal')}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm(b.dataset.add));
$('choosePhoto').onclick=()=>$('photo').click();$('photo').onchange=()=>{let f=$('photo').files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{photoData=rd.result;$('photoPreview').src=photoData};rd.readAsDataURL(f)};$('clearPhoto').onclick=()=>{photoData='';$('photoPreview').removeAttribute('src')};
$('recordForm').onsubmit=e=>{e.preventDefault();let type=$('rtype').value,rec={id:$('rid').value||crypto.randomUUID(),type,date:$('date').value,photo:photoData,note:$('note').value,rating:rate||'',};if(type==='food')Object.assign(rec,{name:$('name').value,price:$('price').value,category:$('category').value});if(type==='tea')Object.assign(rec,{brand:$('teaBrand').value.trim(),flavor:$('teaFlavor').value.trim(),name:$('teaBrand').value+' '+$('teaFlavor').value,sugar:$('sugar').value,ice:$('ice').value,teaTags:selectedTea});if(type==='restaurant')Object.assign(rec,{restaurant:$('restaurantName').value.trim(),location:$('location').value,spend:$('spend').value,dishes:[...$('dishes').querySelectorAll('.dishrow')].map(x=>({name:x.querySelector('.dishname').value,rating:x.querySelector('.dishrate').value,note:x.querySelector('.dishnote').value})).filter(d=>d.name)});let ix=records.findIndex(x=>x.id===rec.id);if(ix>=0)records[ix]=rec;else records.push(rec);persist();render();hideModal('formModal');toast('收录成功，慢慢补充评价就好 ✿')};
document.body.addEventListener('click',e=>{let c=e.target.closest('[data-open]');if(c)openDetail(c.dataset.open)});
function openDetail(id){let r=records.find(x=>x.id===id);if(!r)return;let title=r.type==='restaurant'?r.restaurant:r.type==='tea'?`${r.brand} · ${r.flavor}`:r.name;let extra=r.type==='restaurant'?`<p><b>地点：</b>${esc(r.location||'未填写')}　<b>花费：</b>${esc(r.spend||'未填写')}</p><h3>这次点的菜</h3>${(r.dishes||[]).map(d=>`<div class="dishrow"><b>${esc(d.name)}</b><div class="stars">${d.rating?stars(+d.rating):'未评分'}</div><div class="muted">${esc(d.note||'')}</div></div>`).join('')||'还没记录菜品'}`
:r.type==='tea'?`<p><b>糖度：</b>${esc(r.sugar||'未记录')}　<b>冰量：</b>${esc(r.ice||'未记录')}</p><p>${(r.teaTags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join(' ')}</p>`
:`<p><b>分类：</b>${esc(r.category||'')}　<b>价格：</b>${esc(r.price||'未填写')}</p>`;
$('detail').innerHTML=`${r.photo?`<img class="detail-photo" src="${r.photo}">`:''}<h2>${esc(title)}</h2><p class="muted">${esc(r.date||'日期未填写')}</p>${extra}<div class="stars">${r.rating?stars(+r.rating):'尚未评分'}</div><p class="detail-note">${esc(r.note||'还没有写感想。')}</p><div class="toolbar"><button class="btn" id="editRecord">编辑</button><button class="btn light" id="deleteRecord">删除</button></div>`;showModal('detailModal');$('editRecord').onclick=()=>{hideModal('detailModal');openForm(r.type,r)};$('deleteRecord').onclick=()=>{if(confirm('确定删除这条记录吗？')){records=records.filter(x=>x.id!==id);persist();render();hideModal('detailModal');toast('已删除')}}}
$('backup').onclick=()=>{let blob=new Blob([JSON.stringify(records)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='food-log-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('restore').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=()=>{let f=$('restoreFile').files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let arr=JSON.parse(rd.result);if(!Array.isArray(arr))throw 0;if(confirm('导入会覆盖当前记录，确定继续吗？')){records=arr;persist();render();toast('备份恢复成功')}}catch(e){toast('文件格式不正确')}};rd.readAsText(f)};

// 小票 OCR：Tesseract.js 在浏览器本地识别，识别结果必须由用户确认
let receiptImage='';
$('receiptOpen').onclick=()=>{receiptImage='';$('receiptPhoto').value='';$('receiptPreview').style.display='none';$('ocrText').value='';$('receiptItems').innerHTML='';$('ocrStatus').textContent='';showModal('receiptModal')};
$('receiptPhoto').onchange=()=>{const f=$('receiptPhoto').files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{receiptImage=rd.result;$('receiptPreview').src=receiptImage;$('receiptPreview').style.display='block'};rd.readAsDataURL(f)};
function receiptRow(name='',price=''){
 const el=document.createElement('div');el.className='dishrow';
 el.innerHTML=`<div class="row"><input class="receipt-name" placeholder="商品名称" value="${esc(name)}"><input class="receipt-price" type="number" min="0" step=".01" placeholder="价格" value="${esc(price)}"></div><div class="row"><select class="receipt-cat">${cats.map(c=>`<option>${c}</option>`).join('')}</select><button type="button" class="muted receipt-remove">移除此项</button></div>`;
 el.querySelector('.receipt-remove').onclick=()=>el.remove();$('receiptItems').append(el);
}
$('addReceiptItem').onclick=()=>receiptRow();
function parseReceipt(text){
 const lines=text.split(/\n/).map(s=>s.replace(/[|]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const found=[];
 for(const line of lines){
   // 常见小票商品行：名称 + 数量/单价/金额；优先提取行尾金额
   const m=line.match(/(.{2,}?)[\s　]+(?:x\s*\d+(?:\.\d+)?\s*)?([0-9]{1,4}\.\d{1,2})\s*$/i);
   if(!m)continue;
   let name=m[1].replace(/^[\d*#\-.\s]+/,'').replace(/\s*(合计|小计|实收|应收|优惠|找零|支付|现金|微信|支付宝).*$/,'').trim();
   const price=m[2];
   if(name.length>=2 && !/^(合计|小计|实收|应收|优惠|找零|支付|现金|微信|支付宝)$/.test(name) && !found.some(x=>x.name===name))found.push({name,price});
 }
 return found;
}
$('runOCR').onclick=async()=>{
 if(!receiptImage){toast('先拍一张或选择小票照片');return}
 if(!window.Tesseract){$('ocrStatus').textContent='识别组件加载失败，请检查网络后刷新页面。';return}
 $('runOCR').disabled=true;$('ocrStatus').textContent='正在准备中文识别模型…首次使用会下载模型，请稍等。';
 try{
  const result=await Tesseract.recognize(receiptImage,'chi_sim+eng',{
   logger:m=>{if(m.status==='recognizing text')$('ocrStatus').textContent=`正在识别：${Math.round((m.progress||0)*100)}%`}
  });
  const text=result.data.text||'';$('ocrText').value=text;
  const items=parseReceipt(text);$('receiptItems').innerHTML='';
  items.forEach(x=>receiptRow(x.name,x.price));
  if(!items.length)receiptRow();
  $('ocrStatus').textContent=items.length?`识别完成，初步找到 ${items.length} 项。请核对名称和价格，识别可能有误。`:'文字识别完成，但没有可靠地拆出商品行。可以手动添加商品，或直接修改上面的识别原文。';
 }catch(err){$('ocrStatus').textContent='识别没有成功。iPhone 本地打开 HTML 时，浏览器可能限制识别引擎运行；可以稍后换支持 HTTPS 的网页地址再试。错误：'+(err.message||err)}
 finally{$('runOCR').disabled=false}
};
$('saveReceipt').onclick=()=>{
 const rows=[...$('receiptItems').querySelectorAll('.dishrow')].map(x=>({name:x.querySelector('.receipt-name').value.trim(),price:x.querySelector('.receipt-price').value,category:x.querySelector('.receipt-cat').value})).filter(x=>x.name);
 if(!rows.length){toast('至少保留一项商品名称');return}
 const dateMatch=$('ocrText').value.match(/(20\d{2})[年./-]\s*(\d{1,2})[月./-]\s*(\d{1,2})/);
 const date=dateMatch?`${dateMatch[1]}-${String(dateMatch[2]).padStart(2,'0')}-${String(dateMatch[3]).padStart(2,'0')}`:today();
 rows.forEach(x=>records.push({id:crypto.randomUUID(),type:'food',date,name:x.name,price:x.price,category:x.category,note:'',rating:'',photo:receiptImage}));
 persist();render();hideModal('receiptModal');toast(`已收录 ${rows.length} 项商品 ✿`);
};
